name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# llm-api-engine >=0.2.2 (required by pyproject.toml) is not published on PyPI
# yet; install it from the llm-engine repo. Pinned to a commit for reproducible
# CI. Once 0.2.2 is on PyPI, remove this step and the pre-install in each job.
env:
  LLM_ENGINE_REF: 9394c0c

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install llm-api-engine from source (not on PyPI)
        run: pip install "llm-api-engine @ git+https://github.com/houhuawei23/llm-engine.git@${LLM_ENGINE_REF}"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src/ask_llm
      - name: Mypy
        run: mypy src/ask_llm

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install llm-api-engine from source (not on PyPI)
        run: pip install "llm-api-engine @ git+https://github.com/houhuawei23/llm-engine.git@${LLM_ENGINE_REF}"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage gate
        # Coverage floor set to the measured unit-suite value when the gate
        # was added (audit phase 3); raise it, never lower it.
        run: pytest tests/unit -q --cov=ask_llm --cov-report=term --cov-fail-under=76

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install llm-api-engine from source (not on PyPI)
        run: pip install "llm-api-engine @ git+https://github.com/houhuawei23/llm-engine.git@${LLM_ENGINE_REF}"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Bandit
        run: bandit -r src/ask_llm -ll
